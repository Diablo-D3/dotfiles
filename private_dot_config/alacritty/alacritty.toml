[env]
TERM = "alacritty"
WSLENV = "TERM/u"

[font]
normal = { family = "IoskeleyMonoTerm Nerd Font Mono", style = "SemiCondensed" }
bold = { family = "IoskeleyMonoTerm Nerd Font Mono", style = "SemiCondensed Bold" }
italic = { family = "IoskeleyMonoTerm Nerd Font Mono", style = "SemiCondensed Italic" }
bold_italic = { family = "IoskeleyMonoTerm Nerd Font Mono", style = "SemiCondensed Bold Italic" }
size = 12
# windows/directwrite
offset = { x = -1, y = 0 }
glyph_offset = { x = 0, y = 1 }
# linux/freetype
#offset = { x = 0, y = 0 }
#glyph_offset = { x = 0, y = 0 }

[window]
dimensions = { columns = 80, lines = 25 }
resize_increments = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[terminal]
shell = { program = "bash", args = ["-l"] }
osc52 = "CopyPaste"

[keyboard]
bindings = [{ key = "F11", action = "ToggleFullscreen" }]

# Colors (Root Loops)
# via https://rootloops.sh?sugar=8&colors=7&sogginess=0&flavor=2&fruit=10&milk=0

[colors.primary]
background = '#060606'
foreground = '#f3f3f3'

[colors.cursor]
text = '#060606'
cursor = '#ababab'

[colors.normal]
black = '#222222'
red = '#ec9384'
green = '#6cc581'
yellow = '#cbab4f'
blue = '#96abed'
magenta = '#dd8ed6'
cyan = '#54c0d1'
white = '#ababab'

[colors.bright]
black = '#525252'
red = '#f2b2a6'
green = '#80dc95'
yellow = '#e1c166'
blue = '#b2c3f2'
magenta = '#e7aee1'
cyan = '#70d5e7'
white = '#e2e2e2'
